<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#141e3a"/>
      <stop offset="100%" stop-color="#080c1a"/>
    </linearGradient>
    <radialGradient id="glow-gold" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#ml-bg)"/>
  <rect width="1600" height="700" fill="url(#glow-gold)"/>
  <rect width="1600" height="700" fill="url(#glow-blue)"/>

  <!-- Left Icon Area -->
  <g transform="translate(160, 230)">
    <circle cx="120" cy="120" r="110" fill="#152042" stroke="#38bdf8" stroke-width="4" opacity="0.9"/>
    <circle cx="120" cy="120" r="98" fill="#0d142c"/>
    <!-- Diamond Shape -->
    <polygon points="120,50 180,95 155,185 85,185 60,95" fill="#38bdf8" opacity="0.9"/>
    <polygon points="120,50 155,100 120,185 85,100" fill="#7dd3fc"/>
  </g>

  <!-- Typography -->
  <g transform="translate(460, 230)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="26" font-family="'Oxanium', sans-serif" font-size="14" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="2">MOONTON OFFICIAL</text>

    <text x="0" y="110" font-family="'Oxanium', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="1">MOBILE LEGENDS: BANG BANG</text>
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#94A3B8">Instant Diamonds Send • Direct to User ID &amp; Zone ID • 24/7 Delivery</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">INSTANT DIRECT</text>

      <rect x="195" y="0" width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="285" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ADE80" text-anchor="middle">OFFICIAL TOPUP</text>
    </g>
