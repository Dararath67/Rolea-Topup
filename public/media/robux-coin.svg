<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#F6BA35"/>
      <stop offset="70%" stop-color="#CF8B13"/>
      <stop offset="100%" stop-color="#8F5403"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#F9CE47"/>
      <stop offset="85%" stop-color="#E29E1B"/>
      <stop offset="100%" stop-color="#B77309"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4702"/>
      <stop offset="50%" stop-color="#D99317"/>
      <stop offset="100%" stop-color="#FFEFA8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#D99317" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Drop Shadow & Gold Rim -->
  <circle cx="60" cy="60" r="54" fill="url(#goldRim)" filter="url(#glow)"/>
  
  <!-- Coin Face -->
  <circle cx="60" cy="60" r="47" fill="url(#goldFace)"/>

  <!-- Inner Bevel Circle -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#goldInner)" stroke-width="2.5" opacity="0.8"/>

  <!-- Iconic Robux Hexagon (with tilted square hole) -->
  <g transform="translate(60, 60) rotate(12) translate(-60, -60)">
    <!-- Outer Hex/Rounded Square -->
    <rect x="41" y="41" width="38" height="38" rx="8" fill="#5F3402" opacity="0.3" transform="translate(0, 2)"/>
    <rect x="41" y="41" width="38" height="38" rx="8" fill="url(#goldRim)"/>
    <rect x="43" y="43" width="34" height="34" rx="7" fill="url(#goldFace)"/>
    <!-- Inner square hole -->
    <rect x="52" y="52" width="16" height="16" rx="3" fill="#663901"/>
    <rect x="53" y="53" width="14" height="14" rx="2.5" fill="url(#goldInner)"/>
  </g>

  <!-- Specular Highlight -->
  <path d="M28 26 C42 16 78 16 92 26 C82 22 38 22 28 26 Z" fill="#FFFFFF" opacity="0.55"/>
</svg>